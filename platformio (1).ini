; PlatformIO project configuration for Smart Switchboard
; Board: ESP32 Dev Module (any standard ESP32 will work)
;
; Upload firmware : pio run --target upload
; Upload web files: pio run --target uploadfs
; Monitor serial  : pio device monitor

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

; Serial monitor speed
monitor_speed = 115200

; Libraries
lib_deps =
    ESP Async WebServer @ ^1.2.3
    AsyncTCP @ ^1.1.1
    bblanchon/ArduinoJson @ ^6.21.3
    ; Uncomment the line below to enable MQTT (internet control)
    ; knolleary/PubSubClient @ ^2.8

; Uncomment to enable MQTT
; build_flags = -D MQTT_ENABLED

; SPIFFS filesystem image (web dashboard files in /data folder)
board_build.filesystem = spiffs
